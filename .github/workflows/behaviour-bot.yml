name: Top-5 Leagues Daily & Weekend Behaviour Bot

on:
  schedule:
    # Daily morning sweep at 06:00 UTC
    - cron: '0 6 * * *'
    # Pre-Weekend Friday afternoon sweep (15:00 UTC) for Fri/Sat/Sun Top-5 League fixtures
    - cron: '0 15 * * 5'
    # Saturday & Sunday morning pre-kickoff sweeps (09:00 UTC)
    - cron: '0 9 * * 6,0'
  workflow_dispatch: # Manual 1-click run from GitHub Actions tab

permissions:
  contents: write

jobs:
  collect-and-predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect latest Top-5 League & UEFA match stats
        run: python3 bot-engine/src/top5_collector.py

      - name: Run Walk-Forward Behaviour Scanner & Update Website Data
        run: python3 bot-engine/src/scanner.py

      - name: Sync Behaviour Machine to Cloudflare KV & Telegram Bot
        run: python3 bot-engine/src/sync_machine_to_kv.py || true

      - name: Commit & push updated CSVs and Website Behaviour Data
        run: |
          git config user.name "Bryme-Behaviour-Bot"
          git config user.email "bot@predictions.thebryme.com"
          git add bot-engine/data/*.csv bot-engine/DAILY_PICKS.md src/data/behaviourMachineData.js
          git diff --staged --quiet || git commit -m "chore(bot): auto-update Top-5 match stats & weekend value picks"
          git push
