name: Ground Zero Automated Post-Matchweek Grading & Retraining

on:
  schedule:
    # Post-Champions League Retraining (Tue & Wed 22:35 UTC / 23:35 WAT)
    - cron: '35 22 * * 2,3'
    # Post-Europa & Conference League Retraining (Thu 22:45 UTC / 23:45 WAT)
    - cron: '45 22 * * 4'
    # Post-Friday, Saturday & Sunday Full-Time Grading & Retraining (21:45 UTC / 22:45 WAT + Morning 06:00 UTC)
    - cron: '45 21 * * 5,6,0'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-grade-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh All 20 Leagues Match Box Scores & Recompile Ground Zero Data
        run: |
          python3 bot-engine/src/build_complete_ground_zero_universe.py
          python3 bot-engine/src/compile_ground_zero_site_data.py

      - name: Sync Ground Zero State to Cloudflare KV
        run: python3 bot-engine/src/sync_machine_to_kv.py || true

      - name: Commit & Push Updated Box Scores, Club Logs & Ground Zero Bundle
        run: |
          git config user.name "Ground-Zero-Bot"
          git config user.email "bot@predictions.thebryme.com"
          git add bot-engine/ src/data/groundZeroData.js
          git diff --staged --quiet || (git pull --rebase origin main && git commit -m "chore(ground-zero): auto-grade FT box scores & refresh 360 club logs across 20 leagues" && git push)
