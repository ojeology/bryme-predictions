name: Ground Zero Automated Post-Matchweek Retraining & Intelligence Bot

on:
  schedule:
    # Post-Champions League Retraining (Tue & Wed 22:35 UTC / 23:35 WAT)
    - cron: '35 22 * * 2,3'
    # Post-Europa & Conference League Retraining (Thu 22:45 UTC / 23:45 WAT)
    - cron: '45 22 * * 4'
    # Pre-Weekend Scan & Post-Matchweek Retraining (Fri/Sat/Sun)
    - cron: '0 6 * * *'
    - cron: '30 21 * * 5,6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-retrain-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect latest League, UEFA & Referee Behaviour Stats
        run: python3 bot-engine/src/top5_collector.py

      - name: Retrain Weights, Rebuild 100% Vault, Ledger & Ground Zero Data Bundle
        run: |
          python3 bot-engine/src/scanner.py
          python3 bot-engine/src/weekend_top5_engine.py
          python3 bot-engine/src/enrich_machine_data.py
          python3 bot-engine/src/build_website_live_bundle.py
          python3 bot-engine/src/compile_ground_zero_site_data.py

      - name: Sync Ground Zero State to Cloudflare KV
        run: python3 bot-engine/src/sync_machine_to_kv.py || true

      - name: Commit & Push Updated Retraining Weights, Ledger & Ground Zero Bundle
        run: |
          git config user.name "Ground-Zero-Bot"
          git config user.email "bot@predictions.thebryme.com"
          git add bot-engine/ src/data/
          git diff --staged --quiet || (git pull --rebase origin main && git commit -m "chore(retrain): auto-retrain club weights, vault & Ground Zero matchweek intelligence" && git push)
